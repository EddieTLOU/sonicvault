<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SonicVault Ultra - Pro Audio Locker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        button, [role="button"], input[type="file"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes bounce-bar {
            0%, 100% { height: 4px; }
            50% { height: 24px; }
        }
        .v-bar { animation: bounce-bar 0.6s ease-in-out infinite; }
        .v-bar:nth-child(2) { animation-delay: 0.15s; animation-duration: 0.4s; }
        .v-bar:nth-child(3) { animation-delay: 0.3s; animation-duration: 0.7s; }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-300 ease-out">
        <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin mb-4"></div>
        <h1 class="text-xl font-bold tracking-widest text-slate-200">SONICVAULT</h1>
    </div>

    <!-- SIGN-UP / SIGN-IN GATEWAY -->
    <div id="auth-screen" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-950 p-5 overflow-y-auto pb-safe">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl my-auto">
            
            <div class="flex border-b border-slate-800 mb-6 text-sm">
                <button id="tab-btn-signup" onclick="toggleAuthView('signup')" class="flex-1 pb-4 text-cyan-400 border-b-2 border-cyan-400 font-bold uppercase tracking-wider text-xs active:scale-95 transition-transform">Create Vault</button>
                <button id="tab-btn-signin" onclick="toggleAuthView('signin')" class="flex-1 pb-4 text-slate-500 font-bold uppercase tracking-wider text-xs active:scale-95 transition-transform">Sign In</button>
            </div>

            <!-- Panel: Sign Up / Create Vault -->
            <div id="panel-signup" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">User Handle</label>
                    <input type="text" id="su-name" placeholder="Alex Mercer" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="su-email" placeholder="alex@vault.io" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Vault Password</label>
                    <input type="password" id="su-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="executeVaultSignUp()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold py-4 rounded-xl text-xs uppercase tracking-widest mt-2 active:scale-98 transition-transform">
                    Generate New Vault
                </button>
            </div>

            <!-- Panel: Sign In -->
            <div id="panel-signin" class="space-y-4 hidden">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="si-email" placeholder="alex@vault.io" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Account Password</label>
                    <input type="password" id="si-password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="executeVaultSignIn()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold py-4 rounded-xl text-xs uppercase tracking-widest mt-2 active:scale-98 transition-transform">
                    Unlock Vault
                </button>
            </div>
            <p id="auth-error-msg" class="text-red-400 text-[11px] font-medium mt-3 hidden text-center"></p>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard" class="hidden fixed inset-0 flex flex-col bg-slate-950 pt-safe pb-safe">
        <header class="h-16 bg-slate-900/80 border-b border-slate-800/60 px-4 flex items-center justify-between backdrop-blur-md z-30">
            <div class="flex items-center space-x-2">
                <i data-lucide="radio" class="w-5 h-5 text-cyan-400"></i>
                <span class="text-sm font-black tracking-wider text-slate-200">SONICVAULT</span>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Clean navigation interface profile node -->
                <div class="w-11 h-11 bg-gradient-to-br from-cyan-400 to-indigo-600 rounded-full flex items-center justify-center font-bold text-slate-950 text-xs shadow-md active:scale-95 transition-transform" id="user-avatar" onclick="triggerProfileDisconnect()">
                    U
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar pb-28 p-4 space-y-6">
            <div id="drop-zone" class="border-2 border-dashed border-slate-800 bg-slate-900/20 rounded-2xl p-6 text-center cursor-pointer flex flex-col items-center justify-center active:bg-slate-900/40 transition-colors">
                <input type="file" id="audio-file-input" accept="audio/mp3, audio/mpeg" class="hidden" onchange="processAudioInflow(event)">
                <div class="w-12 h-12 rounded-2xl bg-slate-800 text-cyan-400 flex items-center justify-center mb-3">
                    <i data-lucide="music" class="w-5 h-5"></i>
                </div>
                <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wide">Ingest Audio Track</h3>
            </div>

            <div>
                <div class="flex items-center justify-between mb-4 px-1">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Secure Locker Catalog</h2>
                    <span id="track-count" class="text-[9px] font-bold bg-slate-900 text-slate-400 px-2.5 py-1 rounded-md border border-slate-800">0 TRACKS</span>
                </div>
                
                <div id="empty-state" class="text-center py-16 border border-slate-900/60 bg-slate-900/10 rounded-2xl">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wide">No Tracks Mounted</p>
                </div>

                <div id="music-grid" class="grid grid-cols-2 gap-4 hidden"></div>
            </div>
        </div>

        <!-- FOOTER MEDIA PLAYER BAR -->
        <footer class="fixed bottom-0 left-0 right-0 h-24 bg-slate-900/95 border-t border-slate-800/80 backdrop-blur-xl px-4 pb-safe flex flex-col justify-center z-30">
            <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3 w-[50%] min-w-0">
                    <div class="w-11 h-11 bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex-shrink-0 relative">
                        <img id="player-art" src="" class="w-full h-full object-cover hidden">
                        <div id="player-art-placeholder" class="w-full h-full bg-slate-800 flex items-center justify-center text-slate-600"><i data-lucide="disc" class="w-5 h-5"></i></div>
                        <div id="player-visualizer" class="absolute inset-0 bg-slate-950/80 hidden flex items-end justify-center gap-[2px] pb-1">
                            <span class="v-bar w-1 bg-cyan-400 rounded-t"></span>
                            <span class="v-bar w-1 bg-cyan-400 rounded-t"></span>
                            <span class="v-bar w-1 bg-cyan-400 rounded-t"></span>
                        </div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p id="player-title" class="text-xs font-bold text-slate-200 truncate">Deck Offline</p>
                        <p id="player-artist" class="text-[10px] font-medium text-slate-500 truncate mt-0.5">Select a track</p>
                    </div>
                </div>

                <div class="flex items-center space-x-1 justify-end w-[48%]">
                    <button onclick="stepTrackBack()" class="w-12 h-12 text-slate-400 flex items-center justify-center active:text-cyan-400 active:scale-90 transition-all" id="prev-btn" disabled><i data-lucide="skip-back" class="w-5 h-5 fill-current"></i></button>
                    <button onclick="toggleAudioPlayback()" class="w-12 h-12 bg-slate-100 text-slate-950 rounded-full flex items-center justify-center shadow-lg mx-1 active:scale-90 transition-transform" id="play-btn" disabled><i data-lucide="play" class="w-5 h-5 fill-current ml-0.5" id="play-icon"></i></button>
                    <button onclick="stepTrackForward()" class="w-12 h-12 text-slate-400 flex items-center justify-center active:text-cyan-400 active:scale-90 transition-all" id="next-btn" disabled><i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i></button>
                </div>
            </div>

            <div class="w-full flex items-center space-x-2 text-[9px] font-bold text-slate-500 mt-2 px-0.5">
                <span id="current-time">0:00</span>
                <div class="flex-1 relative py-2 cursor-pointer" id="progress-container">
                    <div class="h-[3px] bg-slate-800 rounded-full w-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-cyan-400 w-0"></div>
                    </div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </footer>
    </div>

    <!-- METADATA MODAL -->
    <div id="metadata-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-xs font-bold text-slate-200 uppercase tracking-widest">Catalog Metadata</h3>
                <button onclick="closeMetadataModal()" class="w-12 h-12 flex items-center justify-center text-slate-500 active:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-2">Cover Art</label>
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 border border-slate-800 bg-slate-950 rounded-xl flex items-center justify-center relative overflow-hidden flex-shrink-0">
                            <img id="cover-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                            <i data-lucide="image" id="cover-prompt" class="text-slate-700 w-5 h-5"></i>
                        </div>
                        <div class="flex-1 grid grid-cols-2 gap-2">
                            <button onclick="triggerImageInput('library')" class="bg-slate-800 text-[11px] font-bold text-slate-300 py-3.5 rounded-lg active:bg-slate-700">Library</button>
                            <button onclick="triggerImageInput('camera')" class="bg-slate-800 text-[11px] font-bold text-slate-300 py-3.5 rounded-lg active:bg-slate-700">Camera</button>
                        </div>
                    </div>
                    <input type="file" id="cover-file-library" accept="image/*" class="hidden" onchange="processImageFile(event)">
                    <input type="file" id="cover-file-camera" accept="image/*" capture="environment" class="hidden" onchange="processImageFile(event)">
                    <input type="text" id="cover-url" placeholder="Or paste image link URL..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-300 mt-2 focus:outline-none focus:border-cyan-500" oninput="processImageUrlInput(this.value)">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Track Audio Title</label>
                    <input type="text" id="meta-title" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Artist / Producer</label>
                    <input type="text" id="meta-artist" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none">
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                <button onclick="closeMetadataModal()" class="px-5 py-3 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl active:bg-slate-700">Cancel</button>
                <button onclick="commitTrackToIndexedDB()" class="px-6 py-3 bg-cyan-500 text-slate-950 text-xs font-bold rounded-xl active:bg-cyan-400">Mount Track</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT INFRASTRUCTURE ENGINE -->
    <script>
        let db = null;
        let vaultCatalogDeck = [];
        let activePlaybackIndex = null;
        let globalAudioEngine = new Audio();
        
        let stagingAudioBase64 = "";
        let stagingCoverBase64 = "";

        function initIndexedDBStore(callback) {
            const request = indexedDB.open("SonicVaultDB", 1);
            request.onupgradeneeded = (e) => {
                let database = e.target.result;
                if (!database.objectStoreNames.contains("tracks")) {
                    database.createObjectStore("tracks", { keyPath: "id" });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                if(callback) callback();
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initIndexedDBStore(() => {
                setTimeout(() => {
                    document.getElementById('splash-screen').classList.add('opacity-0');
                    setTimeout(() => {
                        document.getElementById('splash-screen').style.display = 'none';
                        evaluateActiveSession();
                    }, 300);
                }, 1000);
            });

            const progressContainer = document.getElementById('progress-container');
            const handleScrub = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                if(activePlaybackIndex === null || !globalAudioEngine.duration) return; 
                const bounding = progressContainer.getBoundingClientRect(); 
                let positionX = (touch.clientX - bounding.left) / bounding.width;
                if(positionX < 0) positionX = 0; if(positionX > 1) positionX = 1;
                globalAudioEngine.currentTime = positionX * globalAudioEngine.duration;
            };
            progressContainer.addEventListener('touchstart', handleScrub);
            progressContainer.addEventListener('touchmove', handleScrub);
            progressContainer.addEventListener('click', handleScrub);

            document.getElementById('drop-zone').addEventListener('click', () => document.getElementById('audio-file-input').click());
            
            globalAudioEngine.addEventListener('timeupdate', () => {
                if(!globalAudioEngine.duration) return;
                document.getElementById('progress-bar').style.width = `${(globalAudioEngine.currentTime / globalAudioEngine.duration) * 100}%`;
                document.getElementById('current-time').textContent = formatTimestamp(globalAudioEngine.currentTime);
            });
            globalAudioEngine.addEventListener('loadedmetadata', () => {
                document.getElementById('total-duration').textContent = formatTimestamp(globalAudioEngine.duration);
            });
            globalAudioEngine.addEventListener('ended', () => stepTrackForward());
        });

        function evaluateActiveSession() {
            const activeSessionToken = localStorage.getItem('sonic_vault_profile_token');
            if(activeSessionToken) {
                bootstrapDashboard(JSON.parse(activeSessionToken));
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        function toggleAuthView(view) {
            const isSignUp = view === 'signup';
            document.getElementById('panel-signup').classList.toggle('hidden', !isSignUp);
            document.getElementById('panel-signin').classList.toggle('hidden', isSignUp);
            document.getElementById('tab-btn-signup').className = isSignUp ? "flex-1 pb-4 text-cyan-400 border-b-2 border-cyan-400 font-bold text-xs uppercase" : "flex-1 pb-4 text-slate-500 font-bold text-xs uppercase";
            document.getElementById('tab-btn-signin').className = !isSignUp ? "flex-1 pb-4 text-emerald-400 border-b-2 border-emerald-400 font-bold text-xs uppercase" : "flex-1 pb-4 text-slate-500 font-bold text-xs uppercase";
        }

        function executeVaultSignUp() {
            const name = document.getElementById('su-name').value.trim();
            const email = document.getElementById('su-email').value.trim();
            const pass = document.getElementById('su-password').value;
            const err = document.getElementById('auth-error-msg');

            if(!name || !email || !pass) { err.textContent = "All parameters mandatory."; err.classList.remove('hidden'); return; }
            
            const profile = { name, email, passwordHash: btoa(pass) };
            localStorage.setItem('sonic_vault_profile_token', JSON.stringify(profile));
            document.getElementById('auth-screen').classList.add('hidden');
            bootstrapDashboard(profile);
        }

        function executeVaultSignIn() {
            const emailInput = document.getElementById('si-email').value.trim();
            const passInput = document.getElementById('si-password').value;
            const err = document.getElementById('auth-error-msg');

            const activeSessionToken = localStorage.getItem('sonic_vault_profile_token');
            if(!activeSessionToken) {
                err.textContent = "No profile found. Create a Vault profile first."; err.classList.remove('hidden'); return;
            }

            const existingProfile = JSON.parse(activeSessionToken);
            if(existingProfile.email === emailInput && existingProfile.passwordHash === btoa(passInput)) {
                document.getElementById('auth-screen').classList.add('hidden');
                bootstrapDashboard(existingProfile);
            } else {
                err.textContent = "Invalid credential pair match."; err.classList.remove('hidden'); return;
            }
        }

        function bootstrapDashboard(session) {
            document.getElementById('user-avatar').textContent = session.name.charAt(0).toUpperCase();
            loadTracksFromDB();
            document.getElementById('main-dashboard').classList.remove('hidden');
        }

        function triggerProfileDisconnect() {
            if(confirm("Lock space and disconnect session?")) {
                globalAudioEngine.pause();
                document.getElementById('main-dashboard').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                resetPlayerConsoleUI();
            }
        }

        function processAudioInflow(e) {
            if(!e.target.files.length) return;
            const file = e.target.files[0];
            const cleanName = file.name.replace(/\.[^/.]+$/, "");
            const parts = cleanName.split(" - ");

            document.getElementById('meta-title').value = parts[1] || cleanName;
            document.getElementById('meta-artist').value = parts[0] || "Unknown Creator";

            const reader = new FileReader();
            reader.onload = (ex) => { stagingAudioBase64 = ex.target.result; document.getElementById('metadata-modal').classList.remove('hidden'); };
            reader.readAsDataURL(file);
        }

        function triggerImageInput(channel) {
            if(channel === 'library') document.getElementById('cover-file-library').click();
            if(channel === 'camera') document.getElementById('cover-file-camera').click();
        }

        function processImageFile(e) {
            if(!e.target.files.length) return;
            const reader = new FileReader();
            reader.onload = (ex) => {
                stagingCoverBase64 = ex.target.result;
                document.getElementById('cover-preview').src = stagingCoverBase64;
                document.getElementById('cover-preview').classList.remove('hidden');
                document.getElementById('cover-prompt').classList.add('hidden');
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        function processImageUrlInput(url) {
            if(!url.trim().length) return;
            stagingCoverBase64 = url;
            document.getElementById('cover-preview').src = url;
            document.getElementById('cover-preview').classList.remove('hidden');
            document.getElementById('cover-prompt').classList.add('hidden');
        }

        function closeMetadataModal() {
            document.getElementById('metadata-modal').classList.add('hidden');
            stagingAudioBase64 = ""; stagingCoverBase64 = "";
            document.getElementById('cover-preview').classList.add('hidden');
            document.getElementById('cover-prompt').classList.remove('hidden');
            document.getElementById('cover-url').value = "";
            document.getElementById('audio-file-input').value = "";
        }

        function commitTrackToIndexedDB() {
            if(!stagingAudioBase64) return;
            const record = {
                id: 'tr_' + Date.now(),
                title: document.getElementById('meta-title').value.trim() || "Untitled Track",
                artist: document.getElementById('meta-artist').value.trim() || "Independent Creator",
                audioBinary: stagingAudioBase64,
                coverArtwork: stagingCoverBase64 || ""
            };

            let transaction = db.transaction(["tracks"], "readwrite");
            transaction.objectStore("tracks").add(record);
            transaction.onsuccess = () => { 
                loadTracksFromDB(); 
                closeMetadataModal(); 
            };
        }

        function loadTracksFromDB() {
            let store = db.transaction(["tracks"], "readonly").objectStore("tracks");
            vaultCatalogDeck = [];
            store.openCursor().onsuccess = (e) => {
                let cursor = e.target.result;
                if(cursor) { vaultCatalogDeck.push(cursor.value); cursor.continue(); } 
                else { renderCatalogDisplayDOM(); }
            };
        }

        function purgeTrackRecord(id, event) {
            if(event) { event.stopPropagation(); }
            if(!confirm("Erase track entry?")) return;
            let transaction = db.transaction(["tracks"], "readwrite");
            transaction.objectStore("tracks").delete(id);
            transaction.oncomplete = () => {
                if(activePlaybackIndex !== null && vaultCatalogDeck[activePlaybackIndex].id === id) {
                    globalAudioEngine.pause();
                    resetPlayerConsoleUI();
                }
                loadTracksFromDB();
            };
        }

        function renderCatalogDisplayDOM() {
            const grid = document.getElementById('music-grid');
            const empty = document.getElementById('empty-state');
            document.getElementById('track-count').textContent = `${vaultCatalogDeck.length} TRACKS`;

            if(!vaultCatalogDeck.length) { empty.classList.remove('hidden'); grid.classList.add('hidden'); return; }
            empty.classList.add('hidden'); grid.classList.remove('hidden'); grid.innerHTML = "";

            vaultCatalogDeck.forEach((track, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col relative";
                
                card.innerHTML = `
                    <div class="relative aspect-square bg-slate-950 overflow-hidden font-sans" onclick="bootTrackStream(${idx})">
                        ${track.coverArtwork ? `<img src="${track.coverArtwork}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-700"><i data-lucide="music-3" class="w-8 h-8"></i></div>`}
                        <div class="absolute bottom-2 right-2 w-10 h-10 rounded-xl bg-cyan-400 text-slate-950 flex items-center justify-center shadow-lg"><i data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i></div>
                        <button onclick="purgeTrackRecord('${track.id}', event)" class="absolute top-1 right-1 w-12 h-12 flex items-center justify-center bg-slate-950/80 text-slate-400 rounded-xl active:bg-red-950/50 active:text-red-400"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                    </div>
                    <div class="p-3 min-w-0"><h4 class="text-xs font-bold text-slate-200 truncate">${track.title}</h4><p class="text-[10px] text-slate-500 truncate mt-0.5">${track.artist}</p></div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function bootTrackStream(idx) {
            activePlaybackIndex = idx;
            const currentTrack = vaultCatalogDeck[idx];

            globalAudioEngine.src = currentTrack.audioBinary;
            globalAudioEngine.load();
            globalAudioEngine.play().catch(() => {});

            if(currentTrack.coverArtwork) {
                document.getElementById('player-art').src = currentTrack.coverArtwork;
                document.getElementById('player-art').classList.remove('hidden');
                document.getElementById('player-art-placeholder').classList.add('hidden');
            } else {
                document.getElementById('player-art').classList.add('hidden');
                document.getElementById('player-art-placeholder').classList.remove('hidden');
            }

            document.getElementById('player-title').textContent = currentTrack.title;
            document.getElementById('player-artist').textContent = currentTrack.artist;
            document.getElementById('play-btn').removeAttribute('disabled');
            document.getElementById('prev-btn').removeAttribute('disabled');
            document.getElementById('next-btn').removeAttribute('disabled');
            document.getElementById('player-visualizer').classList.remove('hidden');
            updatePlayIconState(true);
        }

        function toggleAudioPlayback() {
            if(activePlaybackIndex === null) return;
            if(globalAudioEngine.paused) { globalAudioEngine.play(); updatePlayIconState(true); document.getElementById('player-visualizer').classList.remove('hidden'); }
            else { globalAudioEngine.pause(); updatePlayIconState(false); document.getElementById('player-visualizer').classList.add('hidden'); }
        }

        function updatePlayIconState(isPlaying) {
            const el = document.getElementById('play-icon');
            el.setAttribute('data-lucide', isPlaying ? 'pause' : 'play');
            lucide.createIcons();
        }

        function stepTrackBack() { if(activePlaybackIndex !== null && vaultCatalogDeck.length > 1) bootTrackStream((activePlaybackIndex - 1 + vaultCatalogDeck.length) % vaultCatalogDeck.length); }
        function stepTrackForward() { if(activePlaybackIndex !== null && vaultCatalogDeck.length > 1) bootTrackStream((activePlaybackIndex + 1) % vaultCatalogDeck.length); }
        
        function resetPlayerConsoleUI() {
            activePlaybackIndex = null; document.getElementById('player-title').textContent = "Deck Offline"; document.getElementById('player-artist').textContent = "Select a track";
            document.getElementById('progress-bar').style.width = '0%'; document.getElementById('current-time').textContent = '0:00'; document.getElementById('total-duration').textContent = '0:00';
            document.getElementById('play-btn').setAttribute('disabled', 'true'); document.getElementById('player-visualizer').classList.add('hidden'); updatePlayIconState(false);
        }

        function formatTimestamp(s) { if(isNaN(s)) return "0:00"; return `${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`; }
    </script>
</body>
</html>
